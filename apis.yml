name: Natero
description: >-
  Natero was a customer-success and predictive-analytics platform (an Andreessen
  Horowitz portfolio company) that helped SaaS teams reduce churn, monitor account
  health, and drive expansion using machine learning. It was acquired by Freshworks
  in 2019 and folded into the Freshsuccess product line. As of this enrichment pass
  the standalone company is defunct - the natero.com domain no longer resolves to a
  website, and there is no live developer portal, API reference, or public API
  surface to catalog.
